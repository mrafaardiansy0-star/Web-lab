<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Lab Saya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;
            background: #1e293b;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #cbd5e1;
        }

        button {
            border: 0;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🚀 Web Lab Saya</h1>
        <p>Website pertama saya sudah dibuat!</p>

        <button onclick="alert('Website berhasil berjalan!')">
            Tes Website
        </button>
    </div>

</body>
</html>
