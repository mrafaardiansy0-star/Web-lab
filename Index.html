<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Security Lab</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 30px;
      text-align: center;
      border-radius: 18px;
      background: #1e293b;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🛡️ Web Security Lab</h1>

    <p>Testing API keamanan website.</p>

    <button onclick="testAPI()">
      Test API
    </button>

    <p id="result">Belum ada request.</p>
  </div>

  <script>
    async function testAPI() {
      const result = document.getElementById("result");

      result.textContent = "Menghubungi API...";

      try {
        const response = await fetch("/api/test");
        const data = await response.json();

        result.textContent =
          `Status: ${response.status} — ${data.message}`;
      } catch (error) {
        result.textContent = "API gagal dihubungi.";
      }
    }
  </script>

</body>
</html>
